name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android debugbygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          else
            export PATH="$SDK/cmdline-tools/16.0/bin:$SDK/platform-tools:$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run sync:android
      - name: Bygg debug-APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fsm-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulatorbygg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Bygg for simulator uten signering
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
