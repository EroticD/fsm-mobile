apply plugin: 'com.android.application'

def packageJson = new groovy.json.JsonSlurper().parseText(rootProject.file('../package.json').text)
def appVersionName = System.getenv('ANDROID_VERSION_NAME') ?: (packageJson.version ?: '1.0.0')
def appVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: (findProperty('versionCode') ?: '1')).toString().toInteger()
def releaseTaskRequested = gradle.startParameter.taskNames.any { name ->
    name.toLowerCase(Locale.ROOT).contains('release')
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.toString().trim().isEmpty()
}

android {
    namespace = "no.fsm.felt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "no.fsm.felt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is not configured. Create android/keystore.properties or set " +
        "ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and " +
        "ANDROID_KEY_PASSWORD. See README.md."
    )
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def googleServicesFile = file('google-services.json')
def googleServicesBase64 = System.getenv('GOOGLE_SERVICES_JSON_BASE64')

if (!googleServicesFile.exists() && googleServicesBase64?.trim()) {
    def decoded = java.util.Base64.getMimeDecoder().decode(googleServicesBase64.trim())
    googleServicesFile.withOutputStream { stream -> stream.write(decoded) }
    logger.lifecycle("Decoded GOOGLE_SERVICES_JSON_BASE64 to ${googleServicesFile}")
}

def allowMissingGoogleServices = (
    findProperty('allowMissingGoogleServices') ?: System.getenv('ALLOW_MISSING_GOOGLE_SERVICES')
)?.toBoolean()

if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else if (releaseTaskRequested && !allowMissingGoogleServices) {
    throw new GradleException(
        "google-services.json is required for release builds because push notifications " +
        "use Firebase Cloud Messaging. Add it to android/app/ (it is ignored by git), " +
        "set GOOGLE_SERVICES_JSON_BASE64, or pass -PallowMissingGoogleServices=true " +
        "to build a release without push. Debug builds work without it."
    )
} else if (releaseTaskRequested) {
    logger.warn(
        "google-services.json not found; building release WITHOUT push notifications " +
        "because allowMissingGoogleServices=true."
    )
} else {
    logger.info("google-services.json not found; push notifications are disabled in this build")
}
